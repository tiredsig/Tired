<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Love</title>
    <style>
        /* Base page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #ffb6c1; /* Soft pink background */
            color: #ffffff;            /* White text */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;         
            position: relative;
            cursor: pointer;          
        }

        /* Central text block */
        .message-container {
            text-align: center;
            padding: 20px;
            z-index: 10;              
            pointer-events: none;     
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        p {
            font-size: 1.8rem;
            margin-top: 15px;
            opacity: 0;               
            transform: translateY(10px);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s; 
        }

        .revealed p {
            opacity: 0.9;
            transform: translateY(0);
        }

        /* Floating heart structures */
        .heart-effect {
            position: absolute;
            font-size: 2.5rem;
            cursor: pointer;
            pointer-events: auto; 
            animation: floatUp 5s linear forwards; /* Smooth, steady float duration */
            opacity: 0; 
            z-index: 5;
        }

        /* FIXED: Animation travels past the very top (-15vh) before vanishing */
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6) rotate(0deg);
                opacity: 0; 
            }
            10% {
                opacity: 0.9; /* Quick fade in near the bottom */
            }
            90% {
                opacity: 0.9; /* Stays fully solid through the middle and top screen */
            }
            100% {
                transform: translateY(-15vh) scale(1.2) rotate(360deg); /* Clear of the top ceiling */
                opacity: 0; 
            }
        }

        /* Confetti particle element */
        .confetti {
            position: absolute;
            pointer-events: none;
            z-index: 15;
            border-radius: 50%; 
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Invisible Audio Element -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <div class="message-container" id="textWrapper">
        <h1 id="mainHeading">tap me</h1>
        <p id="subHeading">spread love.</p>
    </div>

    <script>
        const body = document.body;
        const mainHeading = document.getElementById('mainHeading');
        const textWrapper = document.getElementById('textWrapper');
        const bgMusic = document.getElementById('bgMusic');

        let hasBeenTapped = false;
        const confettiColors = ['#fff0f5', '#ff69b4', '#ff1493', '#ffc0cb', '#ffffff'];

        // BACKGROUND MUSIC & MAIN INTERACTION
        body.addEventListener('click', () => {
            if (!hasBeenTapped) {
                mainHeading.textContent = "love you";
                textWrapper.classList.add('revealed');
                
                bgMusic.play().catch(error => {
                    console.log("Audio playback failed or blocked:", error);
                });

                hasBeenTapped = true;
            }
        });

        // TUNED GENERATOR: Balances the amount of hearts on the screen perfectly
        setInterval(() => {
            const randomX = Math.random() * window.innerWidth;
            createAutoHeart(randomX, window.innerHeight);
        }, 850); // Increased from 600ms to 850ms so the screen feels spacious and not overcrowded

        function createAutoHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('heart-effect');
            heart.innerHTML = '❤️'; 

            heart.style.left = x + 'px';
            heart.style.top = y + 'px';

            const randomScale = 0.6 + Math.random() * 0.9; // Balanced max sizing
            heart.style.transform = `scale(${randomScale})`;

            // Slower vertical travel speeds (4.5s to 6.5s) to allow a taller journey
            const randomDuration = 4.5 + Math.random() * 2;
            heart.style.animationDuration = randomDuration + 's';

            // INTERACTIVE POPPING ENGINE
            heart.addEventListener('mousedown', (event) => {
                event.stopPropagation(); 
                
                const rect = heart.getBoundingClientRect();
                const heartCenterX = rect.left + rect.width / 2;
                const heartCenterY = rect.top + rect.height / 2;

                createConfettiExplosion(heartCenterX, heartCenterY);
                heart.remove();
            });

            body.appendChild(heart);

            // Memory collection cleanup
            setTimeout(() => {
                if (heart.parentNode) {
                    heart.remove();
                }
            }, randomDuration * 1000);
        }

        // CONFETTI PHYSICS ENGINE
        function createConfettiExplosion(x, y) {
            const particleCount = 20; 

            for (let i = 0; i < particleCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');

                confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';

                const size = 6 + Math.random() * 8;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';

                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 100;
                const targetX = Math.cos(angle) * velocity;
                const targetY = Math.sin(angle) * velocity;

                confetti.style.setProperty('--tx', `${targetX}px`);
                confetti.style.setProperty('--ty', `${targetY}px`);

                body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 600);
            }
        }
    </script>
</body>
</html>
