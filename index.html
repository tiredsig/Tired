<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Love</title>
    <style>
        /* Base page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #ffb6c1; /* Soft pink background */
            color: #ffffff;            /* White text */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;         
            position: relative;
            cursor: pointer;          
        }

        /* Central text block */
        .message-container {
            text-align: center;
            padding: 20px;
            z-index: 10;              
            pointer-events: none;     
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        p {
            font-size: 1.8rem;
            margin-top: 15px;
            opacity: 0;               
            transform: translateY(10px);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s; 
        }

        .revealed p {
            opacity: 0.9;
            transform: translateY(0);
        }

        /* Floating heart structures */
        .heart-effect {
            position: absolute;
            font-size: 2rem;
            color: #ffffff;
            pointer-events: none;     
            animation: floatUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0; 
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0; 
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Invisible Audio Element -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <div class="message-container" id="textWrapper">
        <h1 id="mainHeading">tap me</h1>
        <p id="subHeading">spread love.</p>
    </div>

    <script>
        const body = document.body;
        const mainHeading = document.getElementById('mainHeading');
        const textWrapper = document.getElementById('textWrapper');
        const bgMusic = document.getElementById('bgMusic');

        let hasBeenTapped = false;

        body.addEventListener('click', (event) => {
            
            if (!hasBeenTapped) {
                mainHeading.textContent = "love you";
                textWrapper.classList.add('revealed');
                
                bgMusic.play().catch(error => {
                    console.log("Audio playback failed or blocked:", error);
                });

                hasBeenTapped = true;
            }

            // 1. Spawn a flying heart directly at your finger tap location
            createHeart(event.clientX, event.clientY);

            // 2. Spawn extra hearts popping out from the center text area
            const textRect = textWrapper.getBoundingClientRect();
            // Pick a random spot along the horizontal width of the text block
            const randomTextX = textRect.left + Math.random() * textRect.width;
            // Target the middle vertical height of the text block
            const textY = textRect.top + (textRect.height / 2);
            
            // Generate the text-burst heart
            createHeart(randomTextX, textY);
        });

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('heart-effect');
            heart.innerHTML = '❤️'; 

            const randomOffset = () => (Math.random() - 0.5) * 40; 
            heart.style.left = (x + randomOffset()) + 'px';
            heart.style.top = (y + 15) + 'px';

            const randomScale = 0.5 + Math.random() * 1.5;
            heart.style.transform = `scale(${randomScale})`;

            const randomDelay = Math.random() * 0.15; 
            heart.style.animationDelay = randomDelay + 's';

            const randomDuration = 2.5 + Math.random() * 1.5;
            heart.style.animationDuration = randomDuration + 's';

            body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, (randomDuration + randomDelay) * 1000);
        }
    </script>
</body>
</html>
