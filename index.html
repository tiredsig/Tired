<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Love</title>
    <style>
        /* Base page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #ffb6c1; /* Soft pink background */
            color: #ffffff;            /* White text */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;         
            position: relative;
            cursor: pointer;          
        }

        /* Central text block */
        .message-container {
            text-align: center;
            padding: 20px;
            z-index: 10;              
            pointer-events: none;     
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        p {
            font-size: 1.8rem;
            margin-top: 15px;
            opacity: 0;               
            transform: translateY(10px);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s; 
        }

        .revealed p {
            opacity: 0.9;
            transform: translateY(0);
        }

        /* Floating heart structures */
        .heart-effect {
            position: absolute;
            font-size: 2rem;
            color: #ffffff;
            pointer-events: none;     
            animation: floatUp 3s linear forwards;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Invisible Audio Element -->
    <!-- It looks for a file named music.mp3 inside your GitHub folder -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <div class="message-container" id="textWrapper">
        <h1 id="mainHeading">tap me</h1>
        <p id="subHeading">spread love.</p>
    </div>

    <script>
        const body = document.body;
        const mainHeading = document.getElementById('mainHeading');
        const textWrapper = document.getElementById('textWrapper');
        const bgMusic = document.getElementById('bgMusic');

        let hasBeenTapped = false;

        body.addEventListener('click', (event) => {
            
            // This runs the very first time the user taps the screen
            if (!hasBeenTapped) {
                mainHeading.textContent = "love you";
                textWrapper.classList.add('revealed');
                
                // Triggers the music to play smoothly on the tap
                bgMusic.play().catch(error => {
                    console.log("Audio playback failed or blocked:", error);
                });

                hasBeenTapped = true;
            }

            // Spawns a flying heart at the cursor location on every single tap
            createHeart(event.clientX, event.clientY);
        });

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('heart-effect');
            heart.innerHTML = '❤️'; 

            const randomOffset = () => (Math.random() - 0.5) * 40; 
            heart.style.left = (x + randomOffset()) + 'px';
            heart.style.top = y + 'px';

            const randomScale = 0.5 + Math.random() * 1.5;
            heart.style.transform = `scale(${randomScale})`;

            const randomDuration = 2 + Math.random() * 2;
            heart.style.animationDuration = randomDuration + 's';

            body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, randomDuration * 1000);
        }
    </script>
</body>
</html>
