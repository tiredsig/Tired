<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Love</title>
    <style>
        /* Base page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #ffb6c1; /* Soft pink background */
            color: #ffffff;            /* White text */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;         
            position: relative;
            cursor: pointer;          
        }

        /* Central text block */
        .message-container {
            text-align: center;
            padding: 20px;
            z-index: 10;              
            pointer-events: none;     
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        p {
            font-size: 1.8rem;
            margin-top: 15px;
            opacity: 0;               
            transform: translateY(10px);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s; 
        }

        .revealed p {
            opacity: 0.9;
            transform: translateY(0);
        }

        /* Floating heart structures */
        .heart-effect {
            position: absolute;
            font-size: 2.5rem;
            cursor: pointer;
            pointer-events: auto; /* Crucial: allows individual hearts to be tapped */
            animation: floatUp 4s linear forwards;
            opacity: 0; 
            z-index: 5;
            transition: transform 0.1s ease;
        }

        /* Continuous float upwards from the bottom of the screen */
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6) rotate(0deg);
                opacity: 0; 
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Confetti particle element */
        .confetti {
            position: absolute;
            pointer-events: none;
            z-index: 15;
            border-radius: 50%; /* Circular confetti shapes */
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Invisible Audio Element -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <div class="message-container" id="textWrapper">
        <h1 id="mainHeading">tap me</h1>
        <p id="subHeading">spread love.</p>
    </div>

    <script>
        const body = document.body;
        const mainHeading = document.getElementById('mainHeading');
        const textWrapper = document.getElementById('textWrapper');
        const bgMusic = document.getElementById('bgMusic');

        let hasBeenTapped = false;

        // Colors for the pink confetti burst explosion
        const confettiColors = ['#fff0f5', '#ff69b4', '#ff1493', '#ffc0cb', '#ffffff'];

        // 1. BACKGOUND MUSIC TRIGGER (Starts audio on the first ever click anywhere)
        body.addEventListener('click', () => {
            if (!hasBeenTapped) {
                mainHeading.textContent = "love you";
                textWrapper.classList.add('revealed');
                
                bgMusic.play().catch(error => {
                    console.log("Audio playback failed or blocked:", error);
                });

                hasBeenTapped = true;
            }
        });

        // 2. AUTOMATIC HEART SPAWNER (Runs endlessly without requiring clicks)
        setInterval(() => {
            // Pick a completely random horizontal coordinate across the screen width
            const randomX = Math.random() * window.innerWidth;
            // Spawn the automatic heart at the bottom boundary line
            createAutoHeart(randomX, window.innerHeight);
        }, 600); // Spawns a fresh automatic floating heart every 600 milliseconds

        function createAutoHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('heart-effect');
            heart.innerHTML = '❤️'; 

            // Initialize positioning configurations
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';

            const randomScale = 0.6 + Math.random() * 1.2;
            heart.style.transform = `scale(${randomScale})`;

            const randomDuration = 3.5 + Math.random() * 2;
            heart.style.animationDuration = randomDuration + 's';

            // 3. INTERACTIVE HEART POPPING & CONFETTI ENGINE
            heart.addEventListener('mousedown', (event) => {
                event.stopPropagation(); // Prevents interaction calculations from leaking to body
                
                // Get the exact center coordinate point of the specific heart clicked
                const rect = heart.getBoundingClientRect();
                const heartCenterX = rect.left + rect.width / 2;
                const heartCenterY = rect.top + rect.height / 2;

                // Create the pink confetti explosion array cluster
                createConfettiExplosion(heartCenterX, heartCenterY);

                // Pop and remove the heart from the website instantly
                heart.remove();
            });

            body.appendChild(heart);

            // Housekeeping cleanup logic
            setTimeout(() => {
                if (heart.parentNode) {
                    heart.remove();
                }
            }, randomDuration * 1000);
        }

        // Confetti physics generation calculation 
        function createConfettiExplosion(x, y) {
            const particleCount = 20; // Quantity of confetti pieces launched per pop

            for (let i = 0; i < particleCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');

                // Assign random pink shades from color tray palette
                confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                
                // Spawn positions locked directly to heart center point coordinates
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';

                // Randomize random sizes for individual confetti dots
                const size = 6 + Math.random() * 8;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';

                // Set explosive scatter trajectory metrics using CSS Custom Properties variables
                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 100;
                const targetX = Math.cos(angle) * velocity;
                const targetY = Math.sin(angle) * velocity;

                confetti.style.setProperty('--tx', `${targetX}px`);
                confetti.style.setProperty('--ty', `${targetY}px`);

                body.appendChild(confetti);

                // Delete particle node tree once explosion translation concludes
                setTimeout(() => {
                    confetti.remove();
                }, 600);
            }
        }
    </script>
</body>
</html>
